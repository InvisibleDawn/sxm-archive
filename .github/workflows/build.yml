# Compile SXM Archive sur les serveurs de GitHub (même organisation que SXM PDF).
#
# - Pull Request et envoi sur main : audit, tests (Rust, JavaScript, interface), installateurs Windows,
#   Fedora 45 et macOS construits, installés et lancés. Rien n'est publié.
# - Publication : envoi sur la branche « publier » (git push -f origin HEAD:publier) ou tag vX.Y.Z.
#   La version est celle de package.json ; vX.Y.Z-beta.N = version de test (canal bêta).
#   La publication n'a lieu qu'après la réussite de TOUS les jobs, et elle échoue si la version existe
#   déjà : une release ou un tag existants ne sont jamais supprimés ni remplacés.
name: Compiler SXM Archive

on:
  pull_request:
  push:
    branches: [main, publier]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEVENZIP_TAG: "25.01"
  CARGO_TERM_COLOR: always
  # true = cette compilation publie (branche publier ou tag) : fichiers de mise à jour signés obligatoires
  PUBLISH: ${{ github.ref == 'refs/heads/publier' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # 0) Dépendances : fichiers de verrouillage cohérents, aucune vulnérabilité connue
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: package-lock.json cohérent avec package.json
        run: npm ci --ignore-scripts
      - name: Vulnérabilités npm (élevées ou critiques = échec)
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo.lock cohérent avec Cargo.toml
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Versions identiques (package.json, Cargo.toml, tauri.conf.json)
        run: |
          A=$(node -p "require('./package.json').version")
          B=$(node -p "require('./src-tauri/tauri.conf.json').version")
          C=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$A tauri.conf.json=$B Cargo.toml=$C"
          test "$A" = "$B" && test "$B" = "$C"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$A" != "$GITHUB_REF_NAME" ]; then echo "::error::tag $GITHUB_REF_NAME ≠ version $A"; exit 1; fi

  # 1) Contrôles et tests sous Linux : formatage, Clippy, tests Rust, tests JavaScript et interface
  controles:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Dépendances Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - name: 7-Zip 25.01 Linux (vérification SHA-256)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$SEVENZIP_TAG" --repo ip7z/7zip --pattern "7z2501-linux-x64.tar.xz" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && grep ' 7z2501-linux-x64.tar.xz$' "$GITHUB_WORKSPACE/third_party/7zip.sha256" | sha256sum -c -)
          mkdir -p src-tauri/bin && tar xJf "$RUNNER_TEMP/7z2501-linux-x64.tar.xz" -C src-tauri/bin 7zz License.txt
      - run: npm ci
      - name: Tests JavaScript
        run: npm test
      - name: Tests de l'interface (Chrome sans écran, CSP de production, français et anglais)
        run: npm run test:e2e
      - name: Formatage Rust
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Tests Rust (moteur, dossiers temporaires, liens)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture

  # 2) Windows : tests, installateurs, installation / désinstallation réelles
  windows:
    needs: [audit, controles]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Embarquer 7-Zip 25.01 (vérification SHA-256)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Stop'
          $sums = @{}
          Get-Content third_party/7zip.sha256 | ForEach-Object { $h, $n = $_ -split '\s+', 2; $sums[$n.Trim()] = $h.ToLower() }
          function Check($path) {
            $name = Split-Path $path -Leaf
            $h = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sums[$name]) { throw "Empreinte SHA-256 invalide pour ${name} : $h" }
            Write-Host "OK  $name  $h"
          }
          gh release download $env:SEVENZIP_TAG --repo ip7z/7zip --pattern "7z2501-x64.exe" --dir $env:RUNNER_TEMP --clobber
          Check "$env:RUNNER_TEMP\7z2501-x64.exe"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:RUNNER_TEMP\7z2501-x64.exe" "-o$env:RUNNER_TEMP\7zx" 7z.exe 7z.dll License.txt -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "extraction de l'installateur 7-Zip impossible" }
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          foreach ($f in '7z.exe', '7z.dll', 'License.txt') { Check "$env:RUNNER_TEMP\7zx\$f"; Copy-Item "$env:RUNNER_TEMP\7zx\$f" src-tauri/bin/ }
      - run: npm ci
      - name: Tests du moteur (Windows)
        run: |
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "tests en échec" }
      - name: Préparer la compilation (mises à jour signées si la clé est disponible)
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node scripts/prepare-build.mjs
      - name: Compiler les installateurs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          # Le format .msi refuse les versions de test (« 3.1.0-beta.1 ») : seulement .exe dans ce cas.
          B=msi,nsis; case "$(node -p "require('./package.json').version")" in *-*) B=nsis ;; esac
          npx tauri build --bundles "$B" -- --locked
      - name: Installer / vérifier / désinstaller (NSIS)
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\SXM Archive"
          foreach ($f in 'sxm-archive.exe', 'bin\7z.exe', 'bin\7z.dll', 'bin\License.txt', 'licenses\THIRD-PARTY-NOTICES.md') {
            if (!(Test-Path "$dir\$f")) { throw "$f non installé" }
          }
          # lancement réel : l'application doit rester ouverte 10 s
          $p = Start-Process "$dir\sxm-archive.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "sxm-archive.exe s'est arrêté (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          # menu contextuel et associations
          foreach ($k in 'HKCU:\Software\Classes\*\shell\SXMArchiveAdd\command', 'HKCU:\Software\Classes\Directory\shell\SXMArchiveAdd\command') {
            $cmd = (Get-ItemProperty -LiteralPath $k).'(default)'
            if ($cmd -notlike "*sxm-archive.exe*%1*") { throw "Menu contextuel absent ou incorrect : $k = $cmd" }
          }
          foreach ($ext in '.zip', '.7z', '.rar') {
            if (-not (Get-ItemProperty -LiteralPath "HKCU:\Software\Classes\$ext" -ErrorAction SilentlyContinue).'(default)') { throw "Association $ext absente" }
          }
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\sxm-archive.exe") { throw "sxm-archive.exe toujours présent après désinstallation" }
          foreach ($k in 'HKCU:\Software\Classes\*\shell\SXMArchiveAdd', 'HKCU:\Software\Classes\Directory\shell\SXMArchiveAdd') {
            if (Test-Path -LiteralPath $k) { throw "Clé de menu contextuel non supprimée : $k" }
          }
          Write-Host "Windows : installation, lancement et désinstallation OK"
      - name: Installer / désinstaller (MSI)
        if: hashFiles('src-tauri/target/release/bundle/msi/*.msi') != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\msi-i.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-i.log" -Tail 40; throw "Installation MSI : code $($p.ExitCode)" }
          $exe = Get-ChildItem 'C:\Program Files\SXM Archive', "$env:LOCALAPPDATA\Programs\SXM Archive", "$env:LOCALAPPDATA\SXM Archive" -Filter sxm-archive.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "sxm-archive.exe introuvable après installation MSI" }
          if (!(Test-Path (Join-Path $exe.DirectoryName 'bin\7z.exe'))) { throw "7z.exe absent (MSI)" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Désinstallation MSI : code $($p.ExitCode)" }
          Write-Host "MSI : installation et désinstallation OK"
      - uses: actions/upload-artifact@v4
        with:
          name: sxm-archive-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  # 3) Fedora 45 : paquet .rpm construit SUR Fedora, installé avec dnf, lancé, désinstallé
  fedora:
    needs: [audit, controles]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 60
    steps:
      - name: Dépendances Fedora
        run: dnf -y install git gcc gcc-c++ make curl file xz openssl-devel webkit2gtk4.1-devel librsvg2-devel nodejs npm rpm-build xorg-x11-server-Xvfb dbus-x11 gh
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: 7-Zip 25.01 Linux (vérification SHA-256)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$SEVENZIP_TAG" --repo ip7z/7zip --pattern "7z2501-linux-x64.tar.xz" --dir /tmp
          (cd /tmp && grep ' 7z2501-linux-x64.tar.xz$' "$GITHUB_WORKSPACE/third_party/7zip.sha256" | sha256sum -c -)
          mkdir -p src-tauri/bin && tar xJf /tmp/7z2501-linux-x64.tar.xz -C src-tauri/bin 7zz License.txt
      - run: npm ci
      - name: Tests JavaScript
        run: npm test
      - name: Tests Rust
        run: |
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Préparer la compilation
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node scripts/prepare-build.mjs
      - name: Paquet .rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles rpm -- --locked
      - name: Installation, lancement et désinstallation sur Fedora
        run: |
          set -eux
          dnf -y install ./src-tauri/target/release/bundle/rpm/*.rpm
          rpm -q sxm-archive
          Z="/usr/lib/SXM Archive/bin/7zz"
          grep -q "Exec=sxm-archive %F" "/usr/share/applications/SXM Archive.desktop"
          test -f /usr/share/file-manager/actions/sxm-archive-compress.desktop
          test -f /usr/share/licenses/sxm-archive/7-Zip-License.txt
          mkdir -p "/tmp/src/Dossier é" && echo SXM > "/tmp/src/Dossier é/fichier.txt"
          printf 'Mot "de" passe\nMot "de" passe\n' | "$Z" a /tmp/t.7z "/tmp/src/Dossier é" -p -mhe=on >/dev/null
          printf 'Mot "de" passe\n' | "$Z" t /tmp/t.7z >/dev/null
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          export DISPLAY=:99
          dbus-launch sxm-archive /tmp/t.7z > app.log 2>&1 & PID=$!
          sleep 15
          cat app.log || true
          kill -0 $PID   # l'application tourne toujours après 15 s
          kill $PID
          dnf -y remove sxm-archive
          if [ -e /usr/bin/sxm-archive ] || [ -e "/usr/lib/SXM Archive" ]; then echo "fichiers restants"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sxm-archive-fedora
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig

  # 4) macOS : application universelle (Intel + Apple Silicon). macos-15-intel : les Mac Apple Silicon
  #    de GitHub sont souvent indisponibles (même choix que SXM PDF).
  macos:
    needs: [audit, controles]
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: 7-Zip 25.01 macOS (SHA-256 + comparaison avec 7-zip.org)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          gh release download "$SEVENZIP_TAG" --repo ip7z/7zip --pattern "7z2501-mac.tar.xz" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && grep ' 7z2501-mac.tar.xz$' "$GITHUB_WORKSPACE/third_party/7zip.sha256" | shasum -a 256 -c -)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/7zorg.tar.xz" https://www.7-zip.org/a/7z2501-mac.tar.xz
          A=$(shasum -a 256 "$RUNNER_TEMP/7z2501-mac.tar.xz" | cut -d' ' -f1); B=$(shasum -a 256 "$RUNNER_TEMP/7zorg.tar.xz" | cut -d' ' -f1)
          echo "GitHub : $A"; echo "7-zip.org : $B"; test "$A" = "$B"
          mkdir -p src-tauri/bin && tar xJf "$RUNNER_TEMP/7z2501-mac.tar.xz" -C src-tauri/bin 7zz License.txt
          chmod +x src-tauri/bin/7zz
      - run: npm ci
      - name: Tests (JavaScript et moteur)
        run: |
          npm test
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: Préparer la compilation
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node scripts/prepare-build.mjs
      - name: Compiler l'application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Vérifier et lancer l'application
        run: |
          set -euo pipefail
          B=src-tauri/target/universal-apple-darwin/release/bundle
          APP="$B/macos/SXM Archive.app"
          lipo -archs "$APP/Contents/MacOS/sxm-archive"
          test -x "$APP/Contents/Resources/bin/7zz"
          codesign --verify --deep --strict "$APP"
          printf 'pw "x"\npw "x"\n' | "$APP/Contents/Resources/bin/7zz" a "$RUNNER_TEMP/t.7z" README.md -p -mhe=on >/dev/null
          printf 'pw "x"\n' | "$APP/Contents/Resources/bin/7zz" t "$RUNNER_TEMP/t.7z" >/dev/null
          "$APP/Contents/MacOS/sxm-archive" "$RUNNER_TEMP/t.7z" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!; sleep 10
          if ! kill -0 $PID 2>/dev/null; then cat "$RUNNER_TEMP/app.log"; echo "l'application s'est arrêtée"; exit 1; fi
          kill $PID
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "$B"/dmg/*.dmg >/dev/null
          test -d "$RUNNER_TEMP/dmg/SXM Archive.app" && hdiutil detach "$RUNNER_TEMP/dmg" >/dev/null
          echo "macOS : application lancée, .dmg vérifié"
      - uses: actions/upload-artifact@v4
        with:
          name: sxm-archive-macos
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # 5) Publication — seulement branche « publier » ou tag, après réussite de tout ce qui précède
  publier:
    needs: [windows, fedora, macos]
    if: github.ref == 'refs/heads/publier' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: sxm-archive-*, path: artefacts }
      - name: Publier la version (sans jamais écraser une version existante)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La release $TAG existe déjà. Augmentez la version au lieu de la remplacer."; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then CIBLE="--verify-tag"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "::error::Le tag $TAG existe déjà."; exit 1
          else CIBLE="--target $GITHUB_SHA"; fi
          mkdir fichiers
          find artefacts -type f -exec cp {} fichiers/ \;
          cd fichiers
          # noms sans espaces : GitHub les remplacerait par des points et casserait les liens de mise à jour
          for f in *; do n="$(echo "$f" | tr ' ' '-')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          ls -lh
          if ! ls *.sig >/dev/null 2>&1; then
            echo "::error::Aucune signature de mise à jour : ajoutez le secret TAURI_SIGNING_PRIVATE_KEY (clé de SXM PDF) avant de publier."; exit 1
          fi
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE="" ;; esac
          # Nouveautés = première section de CHANGELOG.md
          awk '/^## /{n++} n==1' ../CHANGELOG.md | tail -n +2 | head -c 4000 > ../notes.txt
          node ../scripts/latest-json.mjs . "$TAG" "$GITHUB_REPOSITORY" ../notes.txt
          sha256sum $(ls | grep -v -e '\.sig$' -e '^latest\.json$') > SHA256SUMS.txt
          cp ../notes.txt ../notes-page.txt
          printf '\n---\nWindows : SmartScreen > Informations complémentaires > Exécuter quand même.\nMac : clic droit > Ouvrir au premier lancement ; si « endommagé » : xattr -cr "/Applications/SXM Archive.app".\nFedora : sudo dnf install ./SXM-Archive-*.rpm\nVérification : sha256sum -c SHA256SUMS.txt\n' >> ../notes-page.txt
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" $CIBLE $PRE --title "SXM Archive $VERSION" --notes-file ../notes-page.txt
          # Canal bêta (fichier technique) : toujours la dernière version publiée, test ou stable
          cp latest.json beta.json
          gh release view canal-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create canal-beta --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Canal bêta (technique)" --notes "Fichier lu par SXM Archive pour proposer les versions de test. Ne pas supprimer."
          gh release upload canal-beta beta.json --repo "$GITHUB_REPOSITORY" --clobber
