[package]
name = "sxm-archive"
version = "3.0.0"
description = "SXM Archive - gestionnaire d'archives RAR, ZIP, 7z, tar.gz"
authors = ["Invisible_Dawn"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Noms de dossiers temporaires aléatoires (déjà présent dans les dépendances de Tauri)
getrandom = "0.3"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
